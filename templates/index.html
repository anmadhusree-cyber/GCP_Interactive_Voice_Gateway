<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Voice Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2><i class="fab fa-google"></i> Cloud Assistant</h2>
        </div>
        
        <div class="chat-box" id="chat-box">
            <div class="message bot">Hello! Click the microphone to start speaking.</div>
        </div>
        
        <div class="input-area">
            <button id="mic-btn" class="mic-btn"><i class="fas fa-microphone"></i></button>
            <input type="text" id="text-input" placeholder="Or type a message..." autocomplete="off">
            <button id="send-btn" class="send-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const micBtn = document.getElementById('mic-btn');
        const textInput = document.getElementById('text-input');
        const sendBtn = document.getElementById('send-btn');
        let currentAudio = null;
        let recorder, mediaStream;

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function playTTS(text) {
            if (currentAudio) currentAudio.pause();
            const res = await fetch('/api/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            if (res.ok) {
                const blob = await res.blob();
                currentAudio = new Audio(URL.createObjectURL(blob));
                currentAudio.play();
            }
        }

        async function sendMessage(text) {
            if (!text) return;
            addMessage(text, 'user');
            textInput.value = '';

            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ input: text })
            });
            const data = await res.json();
            addMessage(data.output, 'bot');
            playTTS(data.output);
        }

        sendBtn.addEventListener('click', () => sendMessage(textInput.value.trim()));
        textInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(textInput.value.trim()); });

        micBtn.addEventListener('click', async () => {
            if (recorder && recorder.state === 'recording') {
                recorder.stop();
                return;
            }

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recorder = new MediaRecorder(mediaStream, { mimeType: 'audio/webm' });
                let chunks = [];
                
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = async () => {
                    micBtn.classList.remove('recording');
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const fd = new FormData();
                    fd.append('audio', blob);

                    addMessage("...", "user"); // Temporary loading indicator
                    
                    const res = await fetch('/api/stt', { method: 'POST', body: fd });
                    const data = await res.json();
                    
                    chatBox.lastChild.remove(); // Remove loading indicator
                    
                    if (data.text) {
                        sendMessage(data.text);
                    } else {
                        addMessage("Could not hear anything clearly.", 'system');
                    }
                    mediaStream.getTracks().forEach(t => t.stop());
                };

                recorder.start();
                micBtn.classList.add('recording');
            } catch (e) {
                alert('Microphone access denied or unavailable.');
            }
        });
    </script>
</body>
</html>
